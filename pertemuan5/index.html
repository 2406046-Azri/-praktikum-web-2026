<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Aplikasi To-Do List - Modul 5</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
        <h2>Daftar Tugas Saya</h2>

        <!-- Form Input Tugas -->
        <form id="todoForm" novalidate>
            <div class="input-section">
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Ketikkan tugas baru Anda..."
                >

                <button type="submit" class="add-btn">
                    Tambah
                </button>
            </div>

            <!-- Pesan Validasi Input -->
            <div class="error-message" id="inputError">
                Tugas tidak boleh kosong atau kurang dari 5 karakter!
            </div>
        </form>

        <!-- FITUR 1: Penghitung Jumlah Tugas -->
        <div class="task-counter" id="taskCounter">
            Total: 0 Tugas | Selesai: 0 | Belum Selesai: 0
        </div>

        <!-- Daftar Tugas -->
        <ul class="todo-list" id="todoList"></ul>

        <!-- FITUR 2: Tombol Bersihkan Tugas Selesai -->
        <button type="button" class="clear-btn" id="clearCompletedBtn" style="display: none;">
            Bersihkan Tugas Selesai
        </button>
    </div>

    <!-- File JavaScript -->
    <script src="script.js"></script>
</body>
</html>
